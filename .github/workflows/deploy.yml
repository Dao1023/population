name: Deploy to GitHub Pages

on:
  push:
    branches: [master]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 10
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
          cache-dependency-path: web/pnpm-lock.yaml
      - run: pnpm install
        working-directory: web
      - run: pnpm data
        working-directory: web
      - run: pnpm validate
        working-directory: web
      - run: pnpm build
        working-directory: web
      - uses: actions/upload-pages-artifact@v3
        with:
          path: web/dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment_retry.outputs.page_url || steps.deployment.outputs.page_url }}
    steps:
      # deploy-pages 偶尔拿到空的 artifact 列表（github 侧瞬时错误）。
      # build 与 deploy 已拆成两个 job：重跑 deploy 不会再上传第二个同名 artifact；
      # 这里再加一次自动重试，避免整条流水线因为一次 API 抖动而失败。
      - uses: actions/deploy-pages@v4
        id: deployment
        continue-on-error: true
      - name: Wait before retry
        if: steps.deployment.outcome == 'failure'
        run: sleep 20
      - uses: actions/deploy-pages@v4
        id: deployment_retry
        if: steps.deployment.outcome == 'failure'
      - name: Fail if both attempts failed
        if: steps.deployment.outcome == 'failure' && steps.deployment_retry.outcome == 'failure'
        run: exit 1
