<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="420" viewBox="0 0 1200 420" role="img" aria-label="人口与婚姻：中国人口结构与结婚趋势">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#0f172a"/>
      <stop offset="55%" stop-color="#111c33"/>
      <stop offset="100%" stop-color="#0b1220"/>
    </linearGradient>
    <linearGradient id="line" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#38bdf8"/>
      <stop offset="100%" stop-color="#2563eb"/>
    </linearGradient>
    <linearGradient id="fade" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#2563eb" stop-opacity="0.35"/>
      <stop offset="100%" stop-color="#2563eb" stop-opacity="0"/>
    </linearGradient>
  </defs>

  <rect width="1200" height="420" fill="url(#bg)"/>
  <circle cx="1040" cy="60" r="260" fill="#2563eb" opacity="0.10"/>
  <circle cx="120" cy="400" r="200" fill="#38bdf8" opacity="0.06"/>

  <text x="80" y="120" fill="#ffffff" font-size="60" font-weight="700"
        font-family="PingFang SC, Microsoft YaHei, Noto Sans SC, sans-serif">人口与婚姻</text>
  <text x="80" y="168" fill="#94a3b8" font-size="24"
        font-family="PingFang SC, Microsoft YaHei, Noto Sans SC, sans-serif">中国人口结构 · 结婚趋势 · 1951–2200</text>

  <text x="80" y="268" fill="#64748b" font-size="18"
        font-family="PingFang SC, Microsoft YaHei, Noto Sans SC, sans-serif">全国结婚登记对数</text>
  <text x="80" y="322" fill="#f1f5f9" font-size="44" font-weight="700"
        font-family="PingFang SC, Microsoft YaHei, Noto Sans SC, sans-serif">1346.9 万对</text>
  <text x="80" y="352" fill="#64748b" font-size="16"
        font-family="PingFang SC, Microsoft YaHei, Noto Sans SC, sans-serif">2013 年峰值</text>

  <text x="330" y="315" fill="#38bdf8" font-size="28"
        font-family="PingFang SC, Microsoft YaHei, Noto Sans SC, sans-serif">→</text>

  <text x="392" y="322" fill="#f1f5f9" font-size="44" font-weight="700"
        font-family="PingFang SC, Microsoft YaHei, Noto Sans SC, sans-serif">610.6 万对</text>
  <text x="392" y="352" fill="#64748b" font-size="16"
        font-family="PingFang SC, Microsoft YaHei, Noto Sans SC, sans-serif">2024 年，十一年减半</text>

  <g transform="translate(720, 190)">
    <path d="M0,60 L48,52 L96,44 L144,30 L192,26 L240,20 L288,18 L336,0 L384,14 L432,40 L480,66"
          fill="none" stroke="url(#line)" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/>
    <path d="M0,60 L48,52 L96,44 L144,30 L192,26 L240,20 L288,18 L336,0 L384,14 L432,40 L480,66 L480,110 L0,110 Z"
          fill="url(#fade)"/>
    <circle cx="336" cy="0" r="5" fill="#38bdf8"/>
    <circle cx="480" cy="66" r="5" fill="#38bdf8"/>
    <text x="330" y="-16" fill="#94a3b8" font-size="15"
          font-family="PingFang SC, Microsoft YaHei, Noto Sans SC, sans-serif">2013</text>
    <text x="470" y="94" fill="#94a3b8" font-size="15"
          font-family="PingFang SC, Microsoft YaHei, Noto Sans SC, sans-serif">2024</text>
  </g>

  <line x1="80" y1="392" x2="1120" y2="392" stroke="#1e293b" stroke-width="1"/>
  <text x="80" y="412" fill="#475569" font-size="13"
        font-family="PingFang SC, Microsoft YaHei, Noto Sans SC, sans-serif">数据：民政部《民政事业发展统计公报》· 国家统计局 · 2020 年人口普查</text>
</svg>
